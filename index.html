<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBZ 2.0 | Aplicaciones Web Frontend</title>
  <meta name="author" content="Meza Corella Cesar" />
  <meta name="description"
    content="Elige tu guerrero y juega un combate de Dragon Ball por turnos para dos personas en el mismo dispositivo." />
</head>

<body class="bg-black text-white">
  <main class="container mt-4 mb-5">
    <div class="row justify-content-center">
      <div class="col text-center">
        <h1 class="text-danger display-3">
          <i class="fa-solid fa-dragon"></i> DRAGON BALL GAME
          <i class="fa-solid fa-dragon"></i>
        </h1>
      </div>
    </div>
    <p class="text-center text-secondary">
      Dos jugadores · Un dispositivo · Un solo ganador
    </p>
    <p id="estado" class="text-center text-warning" role="status">
      Escribe tu nombre, elige un personaje y pulsa Aceptar.
    </p>
    <section id="seleccion">
      <div class="row justify-content-around mt-4">
        <div id="campo_p1" class="col-md-5">
          <div class="form-floating border border-danger rounded mb-3">
            <input type="text" id="player1" class="form-control" placeholder="Jugador 1" maxlength="24"
              autocomplete="off" />
            <label class="text-danger" for="player1"><i class="fa-solid fa-user me-2"></i>Jugador 1</label>
          </div>
        </div>
        <div id="campo_p2" class="col-md-5">
          <div class="form-floating border border-primary rounded mb-3">
            <input type="text" id="player2" class="form-control" placeholder="Jugador 2" maxlength="24"
              autocomplete="off" />
            <label class="text-primary" for="player2"><i class="fa-solid fa-user me-2"></i>Jugador 2</label>
          </div>
        </div>
      </div>
      <div class="row justify-content-around mt-3">
        <div id="py1" class="col-md-5 text-center">
          <p class="text-danger">Seleccionar personaje</p>
          <div class="row mt-4">
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-danger border border-danger"
                src="./public/img/seleccion/sc01.webp" alt="Veguitto" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-danger border border-danger"
                src="./public/img/seleccion/sc03.webp" alt="Trunks" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-danger border border-danger"
                src="./public/img/seleccion/sc06.webp" alt="Gohan" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-danger border border-danger"
                src="./public/img/seleccion/sc05.webp" alt="Goku" />
            </div>
          </div>
          <div id="preview_p1" class="mt-3 d-none">
            <div class="d-flex flex-column align-items-center justify-content-center">
              <img id="img_preview_p1" src="" alt="Personaje Completo Jugador 1"
                class="img-fluid character-full-preview" />
              <span id="name_preview_p1" class="text-warning fw-bold fs-5 mt-2"></span>
            </div>
          </div>
          <button id="btn_player1" type="button" class="btn btn-danger w-100 mt-4">
            Aceptar <i class="fa-solid fa-gamepad"></i>
          </button>
        </div>
        <div id="py2" class="col-md-5 text-center">
          <p class="text-danger">Seleccionar personaje</p>
          <div class="row mt-4">
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-primary border border-primary"
                src="./public/img/seleccion/sc02.webp" alt="Veguetta" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-primary border border-primary"
                src="./public/img/seleccion/sc08.webp" alt="Cell" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-primary border border-primary"
                src="./public/img/seleccion/sc04.webp" alt="Pikoro" />
            </div>
            <div class="col-3">
              <img class="img-fluid rounded-circle bg-primary border border-primary"
                src="./public/img/seleccion/sc07.webp" alt="Gogeta" />
            </div>
          </div>
          <div id="preview_p2" class="mt-3 d-none">
            <div class="d-flex flex-column align-items-center justify-content-center">
              <img id="img_preview_p2" src="" alt="Personaje Completo Jugador 2"
                class="img-fluid character-full-preview" />
              <span id="name_preview_p2" class="text-info fw-bold fs-5 mt-2"></span>
            </div>
          </div>
          <button id="btn_player2" type="button" class="btn btn-primary w-100 mt-4">
            Aceptar <i class="fa-solid fa-gamepad"></i>
          </button>
        </div>
      </div>
    </section>
    <div id="attack-overlay" class="attack-overlay" aria-live="polite" aria-hidden="true">
      <img id="attack-visual" src="" alt="Animación del ataque" class="attack-visual" />
    </div>
    <section id="arena" class="d-none" aria-label="Combate">
      <h2 id="turno" class="text-center mb-4" tabindex="-1"></h2>
      <div id="luchadores" class="row g-4"></div>
      <div id="resultado" class="text-center my-4" role="status"></div>
      <div class="d-flex justify-content-center gap-3 my-4 flex-wrap">
        <button id="revancha" class="btn btn-warning d-none">Revancha</button>
        <button id="cambiar" class="btn btn-outline-light">
          Cambiar personajes
        </button>
      </div>
    </section>
  </main>
  <footer class="academic-footer container text-center pb-4">
    <p class="mb-1">
      <strong>Aplicaciones Web Frontend</strong> · Proyecto DBZ 2.0
    </p>


  </footer>
  <script src="./bundle.js" defer></script>
</body>

</html>
